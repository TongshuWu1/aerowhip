[camera]
resolution = "HD720"
fps = 60
depth_mode = "NEURAL"

# These are the least restrictive ZED runtime thresholds. No application-side
# depth, confidence, spatial, stride, or point-count filtering is applied to
# tracking observations. The independent viewer may use its configured stride.
confidence = 100
texture_confidence = 100
fill = true

[viewer]
enabled = true
# "zed" retrieves the SDK XYZRGBA cloud; "depth" unprojects the depth frame
# already used by tracking. Set enabled=false for a headless isolation run.
point_cloud_source = "zed"
rgb_width = 620
cloud_width = 1180
height = 900
# A two-pixel point visually fills the 2x2 block represented by stride 2.
point_size = 2.0
# Redraw the window at the camera rate. New diagnostic frames remain
# best-effort and never block the asynchronous tracking worker.
max_fps = 60
# Full-resolution XYZRGBA geometry is an independent diagnostic stream. RGB,
# skeleton, PF curves, labels, and window redraw still update at tracking rate.
# Reusing the GPU vertex buffer avoids charging tracking for a million-point
# cloud conversion and upload on every frame.
point_cloud_fps = 4
# Viewer-only spatial sampling. A stride of 2 renders one pixel from each 2x2
# image block (about 25% of the cloud). Tracking always uses full resolution.
point_cloud_stride = 2
# Complete-window diagnostic recording. Encoding is asynchronous and the queue
# is bounded so a slow encoder drops video frames instead of blocking tracking.
recording_directory = "diagnostics/recordings"
recording_fps = 30
recording_codec = "avc1"
recording_queue_frames = 8

[evaluation]
# Separate live plot with the three primary tracking signals. The sampled
# values and the final plot are saved for later analysis.
enabled = true
directory = "diagnostics/evaluation_runs"
sample_hz = 10
history_seconds = 30

[cube_tracking]
# Passive, frame-synchronized RGB-D cube observation. This does not modify
# either cable particle filter and can be disabled for timing isolation.
enabled = true
cube_side_m = 0.150
hue_min = 18
hue_max = 40
saturation_min = 100
value_min = 80
minimum_mask_area_px = 2500
# Remove PIDNet cable pixels plus this boundary radius before cube depth fitting.
# Zero disables cable-mask exclusion for ablation.
cable_exclusion_radius_px = 3
depth_min_m = 0.20
depth_max_m = 3.00
pixel_stride = 2
maximum_points = 12000
plane_inlier_threshold_m = 0.006
ransac_iterations = 96
minimum_face_points = 300
minimum_face_fraction = 0.04
orthogonality_tolerance_deg = 15.0
two_face_minimum_span_fraction = 0.90
two_face_maximum_span_fraction = 1.10
random_seed = 7

[pidnet]
checkpoint = "data/models/pidnet_two_cable_best.pt"
device = "cuda"
threshold = 0.80
endpoint_thresholds = [0.89999998, 0.75]
amp = true
channels_last = true
overlay_alpha = 0.62

[observation]
# Endpoint components smaller than this are treated as NN speckle, not endpoints.
endpoint_min_area_px = 24
endpoint_label_search_px = 18
route_depth_radius_px = 2
route_samples = 128
graph_node_dilation_px = 3
route_candidate_limit = 16
route_search_state_limit = 4096
route_edge_limit = 24
route_length_margin_m = 0.18
graph_edge_samples = 24
component_min_area_px = 8
endpoint_association_gate_m = 0.12
# Diagnostic-only stage timing. This does not change observation mathematics.
profile_stages = true
# Set to 0 to disable periodic OBS_PROFILE console output.
profile_console_period_s = 1.0

[particle_filter]
device = "cuda"
particle_count = 800
node_count = 16
# Both physical cables are identical and measured as 0.518 m tip-to-tip.
cable_lengths_m = [0.518, 0.518]
# Measured physical cable diameter. The PF state remains the medial
# centerline; downstream geometry expands it into a 4.5 mm-radius capsule tube.
cable_diameter_m = 0.009
dense_samples_per_segment = 4
deformation_modes = 5
initial_noise_m = 0.010
global_noise_m = 0.018
global_fraction = 0.10
# Resample only when effective sample size falls below this fraction of the
# population. Systematic resampling is performed entirely on CUDA.
ess_resample_fraction = 0.50
# Constant-velocity state transition with smooth acceleration process noise.
acceleration_noise_mps2 = 0.45
velocity_damping_per_second = 1.25
endpoint_velocity_smoothing = 0.50
# Blend local visible-edge displacement into only the nearby node velocities.
# The arc radius is measured in node spacings; hidden nodes keep their prior.
local_velocity_gain = 0.65
local_support_radius_nodes = 1.0
maximum_node_velocity_mps = 2.50
projection_iterations = 8
velocity_projection_iterations = 2
endpoint_tolerance_m = 0.003
trace_sigma_m = 0.008
huber_delta = 1.5
smoothness_weight = 2.0
support_distance_m = 0.015
maximum_unsupported_length_m = 0.080
unsupported_weight = 1.0
# Prior-based ordered graph-edge association. These costs determine cable
# identity and arc interval; particle likelihood still uses trace_sigma_m.
attribution_curve_samples_per_segment = 4
attribution_distance_sigma_m = 0.012
attribution_length_sigma_m = 0.025
attribution_length_weight = 0.25
attribution_unassigned_energy = 3.0
attribution_minimum_identity_probability = 0.60
# Soft temporal prior for graph-fragment cable identity. Current geometric
# evidence remains the likelihood and can override this prior.
attribution_temporal_identity_weight = 1.0
attribution_temporal_match_sigma_m = 0.020
attribution_temporal_match_gate_m = 0.050
attribution_temporal_history_frames = 5
attribution_temporal_history_decay = 0.75
# Prevent history from becoming a hard identity lock.
attribution_temporal_probability_floor = 0.05
top_particle_count = 40
random_seed = 7
# Reuses CUDA events and the PF's existing synchronization; no extra GPU wait.
profile_stages = true

[features]
connected_trace = true
smoothness = true
fixed_length = true
temporal_prediction = true
# Transport the predicted cable by the measured endpoint boundary residuals
# before fixed-length projection. This is deterministic motion conditioning,
# not a recovery fallback.
endpoint_motion_transport = true
ess_resampling = true
global_particles = true
# Update each supported node from local visible-edge motion. No displacement
# is interpolated or extrapolated across an occluded cable interval.
local_node_motion = true
single_endpoint_updates = false
prediction_without_measurement = true
posterior_uncertainty = true
# Fuses anchored FABRIK sweeps and every velocity projection into native CUDA.
# The exact PyTorch CUDA Graph remains active for centroid-preserving unanchored prediction.
fused_constraint_kernels = true
cuda_graph_replay = true
# Show the prior-based cable identity and ordered arc interval assigned to
# every observed skeleton edge.
graph_edge_attribution = true
# Preserve fragment identity across graph rebuilds and short occlusions.
temporal_edge_identity = true
# Score initialized particles against all confidently attributed visible
# edges, even when no complete endpoint-to-endpoint graph route exists.
visible_edge_scoring = true
# Transport the predicted cable with the displacement measured on its visible
# attributed arc intervals. Hidden intervals retain predicted geometry.
visible_edge_transport = true
# Keep the 10% broad proposal population centered on the visible-edge-
# transported prior while the graph is disconnected.
visible_edge_exploration = true
