# Canonical PIDNet runtime used by both the collection GUI and main tracker.
[pidnet]
checkpoint = "data/models/pidnet_two_cable_best.pt"
device = "cuda"
threshold = 0.9
endpoint_thresholds = [0.82, 0.82]
amp = true
channels_last = true

[detector]
# Body-only cleanup; both endpoint masks remain exactly as thresholded.
min_area_px = 180
open_kernel = 1
close_kernel = 7
