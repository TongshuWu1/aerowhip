name: Source smoke checks
on:
  push:
  pull_request:
jobs:
  cpu:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements/headless.txt pytest
      - run: python run_simulation.py --headless --device cpu --duration 0.05
      - run: python -m pytest tests/physics/test_point_mass.py tests/training/test_early_stop_comparison.py tests/flight/test_flight_adaptation.py -q
