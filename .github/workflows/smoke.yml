name: AeroWhip software checks
on:
  workflow_dispatch:
  push:
    branches: [main, deployment]
  pull_request:
    branches: [main, deployment]
jobs:
  software:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
      PYVISTA_OFF_SCREEN: "true"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/*.txt
      - run: python -m pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements/test.txt -c requirements/deployment-constraints.txt
      - run: python -m pytest tests/deployment tests/flight/test_whip_adaptation.py tests/flight/test_model_evaluation.py tests/flight/test_flight_performance.py tests/flight/test_system_comparison.py tests/flight/test_pva_export.py tests/ui/test_pva_workflow.py tests/ui/test_flight_generations.py tests/ui/test_model_hub.py tests/training/test_source_release.py -q -p no:cacheprovider
