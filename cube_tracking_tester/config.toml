[camera]
resolution = "HD1080"
fps = 30
depth_mode = "NEURAL"
confidence = 100
texture_confidence = 100
fill = true

[cube]
# Known physical edge length of the bright-yellow cube.
side_m = 0.150

[yellow]
# OpenCV HSV limits. The hue range is [0, 179].
hue_min = 18
hue_max = 40
saturation_min = 100
value_min = 80
minimum_mask_area_px = 5625

[fit]
depth_min_m = 0.20
depth_max_m = 3.00
pixel_stride = 2
maximum_points = 12000
# A point belongs to a face hypothesis within this metric distance.
plane_inlier_threshold_m = 0.006
ransac_iterations = 96
minimum_face_points = 300
minimum_face_fraction = 0.04
orthogonality_tolerance_deg = 15.0
# With only two visible faces, their shared-edge point span supplies the third
# centre coordinate. Reject incomplete/contaminated spans rather than guessing.
two_face_minimum_span_fraction = 0.90
two_face_maximum_span_fraction = 1.10
pose_refinement_iterations = 4
pose_refinement_huber_m = 0.004
pose_translation_std_floor_m = 0.0015
pose_rotation_std_floor_deg = 0.75
two_face_center_std_m = 0.004
random_seed = 7

[output]
directory = "diagnostics/experiments/cube_tracking"
