[pidnet]
runtime_config = "NN_collection_training/source/config.toml"

[cable]
# Endpoint channels identify cable identities, not opposite ends.
identity = 1

[route]
endpoint_min_area_px = 2
dense_samples = 128
maximum_segments = 4
minimum_segment_length_px = 40.0

[depth]
minimum_m = 0.20
maximum_m = 4.0
neighborhood_radius_px = 5
minimum_support = 3
maximum_cluster_span_m = 0.025
viewer_stride_px = 4

[viewer]
width_px = 1600
height_px = 760
