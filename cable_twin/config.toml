[camera]
resolution = "HD1080"
fps = 30
depth_mode = "NEURAL"
confidence = 100
texture_confidence = 100
fill = true
disable_self_calibration = true

[svo]
recording_directory = "recordings"
compression = "LOSSLESS"
playback_realtime = false

[pidnet]
runtime_config = "NN_collection_training/source/config.toml"

[observation]
cable_lengths_m = [0.518, 0.518]
endpoint_min_area_px = 54
endpoint_label_search_px = 27
component_min_area_px = 18
depth_radius_px = 3
depth_min_samples = 2
depth_sigma_floor_m = 0.003
pixel_sigma_px = 0.75
graph_node_dilation_px = 5
crossing_depth_exclusion_px = 5.0
edge_samples = 24
route_candidate_limit = 16
route_search_state_limit = 4096
route_edge_limit = 24
route_length_margin_m = 0.18
endpoint_association_gate_m = 0.12

[viewer]
enabled = true
window_name = "Cable Twin 3D Scene"
width_px = 1600
height_px = 900
depth_min_m = 0.20
depth_max_m = 3.00
overlay_alpha = 0.58
point_cloud_stride = 4
point_size_px = 2.0
inset_width_px = 420
render_fps = 15.0

[runtime]
status_period_s = 1.0
