[cable]
# Short online cable from the previous deployed tracker. It is cut from the
# same 3.5 mm cable as the 0.961 m OptiTrack identification specimen.
length_m = 0.518
diameter_m = 0.0035
node_count = 12
# Six substeps keep the latest fitted EI below the conservative explicit
# stability limit at the configured 34 ms maximum PF step. This is a numerical
# solver setting, not an identified material parameter.
solver_substeps = 6
constraint_iterations = 4

[filter]
device = "cuda"
particle_count = 256
random_seed = 0
maximum_dt_s = 0.034
maximum_gap_s = 0.50
ess_resample_fraction = 0.50
process_acceleration_sigma_m_s2 = 0.50
endpoint_acceleration_sigma_m_s2 = 1.00
metric_curve_noise_m = 0.003
metric_endpoint_noise_m = 0.003
body_pixel_sigma_px = 4.0
endpoint_pixel_sigma_px = 6.0
student_t_degrees_of_freedom = 4.0
